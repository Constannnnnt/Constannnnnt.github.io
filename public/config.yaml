projects:
  - title: "Penguin Studio"
    description: "Penguin Studio is an image generation and editing platform that combines text-to-image synthesis with automatic object detection and semantic scene configuration."
    imageUrl: "/assets/img/penguin.png"
    tags:
      [
        "Full-stack",
        "Vision",
        "Prompt Engineering",
        "Chain of Interactions",
        "Human-AI Collaboration",
      ]
    githubUrl: "https://github.com/Constannnnnt/Penguin-Studio"
    summary:
      - "Designed the chain of interactions that turn users's interaction history into a editable prompt."
      - "Designed the interfaces that transformed image descriptions into concrete UI/UX."
      - "Built a full-stack AI system that can generate and edit images with layers control"
    blogUrl: "/?tab=blogs&slug=penguin-studio"
