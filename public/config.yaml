profile:
  name: "Constant, Yuan Chen"
  title: "Researcher & Engineer"
  email: "constant.chen@uwaterloo.ca"
  imageUrl: "/assets/avatar.jpg"
  bio: |
    I am actively looking for full-time opportunities to work in the field of <u>HCI</u>, <u>XR</u>, and <u>Agentic AI</u>.

    I design and build systems that enable seamless interaction anytime, anywhere, and study how people behave and interact across different computing environments. My PhD focuses on pervasive desktop computing and context-aware mixed environments using projection mapping, sensing, and vision inputs.

    I also research Human–AI interaction, with an emphasis on how people understand, collaborate with, and benefit from agentic systems, which I both study and build.

    Feel free to get in touch if you want to discuss collaboration opportunities.
  bioTooltip:
    paragraphIndex: 1
    highlightLabel: " My PhD "
    text: "I was fortunate and grateful to be supervised by"
    supervisors:
      - name: "Prof. Géry Casiez"
        url: "https://cristal.univ-lille.fr/~casiez/"
      - name: "Dr. Sylvain Malacria"
        url: "https://malacria.fr/"
      - name: "Prof. Daniel Vogel"
        url: "https://www.nonsequitoria.com/"
      - name: "the late Prof. Edward Lank"
        url: "https://cs.uwaterloo.ca/~lank/"

  social:
    github: "https://github.com/Constannnnnt"
    twitter: "https://twitter.com/Constannnnnt"
    linkedin: "https://linkedin.com/in/yuanchen525"
    googleScholar: "https://scholar.google.com/citations?user=f0dkPBsAAAAJ"

